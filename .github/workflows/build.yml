name: Build MT8183 Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps (apt with retry)
        run: |
          set -e
          for i in $(seq 1 5); do
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=120 && break || sleep 10
          done
          for i in $(seq 1 5); do
            sudo apt-get install -y \
              gcc-aarch64-linux-gnu libssl-dev libelf-dev dwarves flex bison bc \
              cpio xz-utils ccache && break || sleep 10
          done

      - name: Fetch AOSP clang r416183b
        run: |
          mkdir -p prebuilts/clang/host/linux-x86
          cd prebuilts/clang/host/linux-x86
          curl -L -C - --retry 15 --retry-delay 3 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" \
            -o clang-r416183b.tar.gz
          tar xzf clang-r416183b.tar.gz

      - name: Setup ccache wrappers for clang
        run: |
          mkdir -p ccache-bin
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            ln -sf /usr/bin/ccache ccache-bin/$t
          done
          echo "$PWD/ccache-bin" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-mt8183-${{ github.sha }}
          restore-keys: |
            ccache-mt8183-

      - name: Build
        env:
          CCACHE_DIR: /tmp/ccache
          CCACHE_MAXSIZE: 10G
        run: |
          export PATH="$PWD/ccache-bin:$PWD/prebuilts/clang/host/linux-x86/bin:$PATH"
          ccache -z
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            mt8183-alps_defconfig
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            -k -j$(nproc) Image dtbs
          ccache -s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-TALIH-PD1-515
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/mediatek/mt8183-alps.dtb
          retention-days: 14
